# Publishes the node to registry.comfy.org when the version in
# pyproject.toml changes on main (or on a manual run). Requires the
# REGISTRY_ACCESS_TOKEN repository secret: create a personal access token
# at registry.comfy.org, then Settings > Secrets and variables > Actions.
name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish custom node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
